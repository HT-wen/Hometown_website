<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hometown Supermarket — Produce</title>

  <!-- Base styles -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="produce.css">
  <link rel="stylesheet" href="lightbox.css">

  <!-- Icons / Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;700&display=swap" rel="stylesheet">

  <!-- Basic theming -->
  <meta name="theme-color" content="#0ea5e9" />
  <link rel="icon" href="Images/favicon.png" />
</head>

<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- Header / Top nav -->
  <header class="top-nav" role="banner">
    <div class="left-section">
      <button class="mobile_show" aria-label="Open menu"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
      <img src="Images/Hometown logo.png" alt="Hometown Supermarket" class="logo" />
      <h1 class="title-main">Hometown Supermarket</h1>
    </div>

    <!-- Search container kept, but JS disabled for now -->
    <div class="search-bar-container" aria-disabled="true">
      <input type="search" class="search-bar" placeholder="Search (coming soon)" disabled />
      <div class="search_results_box mobile_hide" hidden></div>
    </div>

    <div class="right-section">
      <button type="button" id="lang-en" aria-pressed="true">English</button>
      <button type="button" id="lang-zh" aria-pressed="false">中文</button>
    </div>
  </header>

  <!-- Category nav -->
  <nav class="nav-bar" aria-label="Primary">
    <div class="menu-items">
      <button class="close-menu" id="xmark" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>

      <div class="dropdown">
        <button class="dropbtn" aria-expanded="false" aria-controls="cat-menu">
          <span aria-hidden="true">&#9776;</span> Categories
        </button>
        <div id="cat-menu" class="dropdown-content" hidden>
          <a href="produce.html">Produce</a>
          <a href="seafood.html">Seafood</a>
          <a href="frozen.html">Frozen</a>
          <a href="meat.html">Meat</a>
          <a href="ramen.html">Noodles</a>
          <a href="beverages.html">Beverages</a>
          <a href="sauces.html">Sauces</a>
          <a href="snacks.html">Snacks</a>
          <a href="alcohol.html">Alcohol</a>
        </div>
      </div>

      <a href="restaurant.html">Restaurant</a>
      <a href="#">New Arrivals</a>
      <a href="#">Deals</a>
      <a href="#">Community Center</a>
      <a href="#">Our Story</a>
      <a href="#">Store Finder</a>
    </div>
  </nav>

  <!-- Hero / page header -->
  <section class="produce-section">
    <div class="produce-container">
        <nav aria-label="Breadcrumb">
            <ol class="breadcrumb">
              <li><a href="index.html">Home</a></li>
              <li aria-current="page">Produce</li>
            </ol>
          </nav>
          
      <h2 class="produce-title">Fresh Produce</h2>
    </div>
  </section>

  <main id="main" class="main-content">
    <!-- Filters -->
    <aside class="filter-section" aria-label="Filters">
      <h3>Filters</h3>

      <div class="filter">
        <label for="category-filter"><strong>Category</strong></label>
        <select id="category-filter" name="category">
          <option value="all">All</option>
          <option value="vegetables">Vegetables</option>
          <option value="fruits">Fruits</option>
        </select>
      </div>

      <div class="filter">
        <label for="price-range"><strong>Price Range</strong></label>
        <input type="range" id="price-range" min="0" max="20" value="5" />
        <output id="price-label" for="price-range">$5</output>
      </div>
    </aside>

    <!-- Products -->
    <section class="product-section" aria-live="polite">
        <template id="product-card">
            <div class="product-item">
              <img alt="">
              <h4></h4>
              <p class="price"></p>
              <p class="description"></p>
            </div>
          </template>
          
      <div id="product-list" class="product-grid" data-empty-text="No products match your filters."></div>
      <noscript><p>Please enable JavaScript to view our products.</p></noscript>
    </section>
  </main>

  <!-- Image viewer (kept for future) -->
  <div id="imgViewerOverlay" aria-hidden="true" hidden>
    <div id="imgViewer" role="dialog" aria-modal="true" aria-labelledby="imgViewerTitle">
      <button id="imgViewerClose" type="button" aria-label="Close">Close ✕</button>

      <div id="imgStage"><img id="imgViewerImg" alt=""></div>
      <div id="imgViewerControls" aria-label="Zoom controls">
        <button type="button" data-zoom="in">+</button>
        <button type="button" data-zoom="out">−</button>
        <button type="button" data-zoom="reset">Reset</button>
      </div>
    </div>
  </div>

  <!-- Templates -->
  <template id="product-card">
    <article class="product-item">
      <img loading="lazy" alt="">
      <h4></h4>
      <p class="price"></p>
      <p class="description"></p>
    </article>
  </template>

  <!-- Scripts (defer = non-blocking) -->
  <script src="script.js" defer></script>
  <script src="produce.js" defer></script>
  <script src="lightbox.js" defer></script>
  <!-- Remove or re-add later when modules are organized -->
  <!-- <script type="module" src="/scripts/main.js"></script> -->
</body>
</html>
